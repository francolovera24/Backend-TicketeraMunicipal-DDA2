# Toda la configuracion se externaliza por variables de entorno.
# Los valores por defecto sirven solo para correr en local contra el docker-compose.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ticketera-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketera}
    username: ${DB_USER:ticketera}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway (db/migration); Hibernate solo lo valida.
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration

  web:
    # Mensajes de Bean Validation en espanol, sin depender de Accept-Language.
    locale: es_AR
    locale-resolver: fixed

  jackson:
    mapper:
      # Acepta "cableado" o "CABLEADO" en tipo y estado.
      accept-case-insensitive-enums: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # El broker confirma cada publicacion; los nacks se loguean (RabbitMQConfig).
    publisher-confirm-type: correlated
    listener:
      simple:
        # ACK del contenedor recien cuando el listener termina sin error.
        acknowledge-mode: auto
        prefetch: 10
        # Un mensaje que agota los reintentos no se reencola: va a la DLX -> DLQ.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

  # Servicio SOAP (Spring-WS): MessageDispatcherServlet en /ws/*
  webservices:
    path: /ws
    servlet:
      init:
        transformWsdlLocations: true

ticketera:
  zona-horaria: ${ZONA_HORARIA:America/Argentina/Buenos_Aires}
  seguridad:
    # Valor de ejemplo SOLO para desarrollo: en cualquier otro entorno definir JWT_SECRET.
    jwt-secret: ${JWT_SECRET:dev-solo-desarrollo-cambiar-en-produccion-0123456789}
    jwt-expiracion: 24h
  ia:
    # stub (por defecto, sin credenciales) o llm (Gemini, requiere LLM_API_KEY)
    generador: ${IA_GENERADOR:stub}
    cache-ttl-minutos: 5
    llm:
      url: ${LLM_URL:https://generativelanguage.googleapis.com/v1beta}
      modelo: ${LLM_MODEL:gemini-3.8-flash}
      api-key: ${LLM_API_KEY:}
      timeout-conexion: 3s
      timeout-lectura: 20s
  duplicados:
    habilitado: ${DUPLICADOS_HABILITADO:true}
    radio-metros: 150
    ventana: 30d
    max-candidatos: 5
  geo:
    habilitado: ${GEO_HABILITADO:true}
    url: ${GEO_URL:https://nominatim.openstreetmap.org}
    user-agent: TicketeraMunicipal-UADE/0.1
    contacto: ${GEO_CONTACTO:}
    contexto: Ciudad Autonoma de Buenos Aires, Argentina
    timeout: 5s
    intervalo-minimo: 1s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    com.municipio.ticketera: ${LOG_LEVEL:INFO}
