# Toda la configuracion se externaliza por variables de entorno.
# Los valores por defecto sirven solo para correr en local contra el docker-compose.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ticketera-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketera}
    username: ${DB_USER:ticketera}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo maneja Flyway (db/migration); Hibernate solo lo valida.
      ddl-auto: validate
    show-sql: false

  flyway:
    locations: classpath:db/migration

  web:
    # Mensajes de Bean Validation en espanol, sin depender de Accept-Language.
    locale: es_AR
    locale-resolver: fixed

  jackson:
    mapper:
      # Acepta "cableado" o "CABLEADO" en tipo y estado.
      accept-case-insensitive-enums: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    com.municipio.ticketera: ${LOG_LEVEL:INFO}
