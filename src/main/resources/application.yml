# Toda la configuracion se externaliza por variables de entorno.
# Los valores por defecto sirven solo para correr en local contra el docker-compose.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ticketera-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ticketera}
    username: ${DB_USER:ticketera}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # En la etapa 2 se define el esquema; por ahora Hibernate lo mantiene.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.municipio.ticketera: ${LOG_LEVEL:INFO}
