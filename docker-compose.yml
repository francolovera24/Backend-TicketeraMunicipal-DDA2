# Credenciales y claves: se leen de .env (copiar .env.example a .env).
# No hay secretos en el repo: las variables sensibles (contrasenas, LLM_API_KEY)
# solo llegan por entorno. Las obligatorias cortan el arranque si faltan (:?).
services:
  app:
    build: .
    container_name: ticketera-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?definir POSTGRES_DB en .env}
      DB_USER: ${POSTGRES_USER:?definir POSTGRES_USER en .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?definir RABBITMQ_USER en .env}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?definir RABBITMQ_PASSWORD en .env}
      IA_GENERADOR: ${IA_GENERADOR:-stub}
      LLM_URL: ${LLM_URL:-https://generativelanguage.googleapis.com/v1beta}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GEO_HABILITADO: ${GEO_HABILITADO:-true}
      GEO_CONTACTO: ${GEO_CONTACTO:-}
      DUPLICADOS_HABILITADO: ${DUPLICADOS_HABILITADO:-true}
      ZONA_HORARIA: ${ZONA_HORARIA:-America/Argentina/Buenos_Aires}
      # Clave de firma de los JWT. El default es SOLO para desarrollo (la app lo avisa en el log).
      JWT_SECRET: ${JWT_SECRET:-dev-solo-desarrollo-cambiar-en-produccion-0123456789}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ticketera
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ticketera-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?definir POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?definir POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD en .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticketera
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticketera-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?definir RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?definir RABBITMQ_PASSWORD en .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ticketera
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Reservado: Cache_Resumenes es en memoria; Redis queda como mejora futura.
  redis:
    image: redis:7-alpine
    container_name: ticketera-redis
    ports:
      - "6379:6379"
    networks:
      - ticketera
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Red propia: los servicios se encuentran por nombre (postgres, rabbitmq, redis).
networks:
  ticketera:
    name: ticketera-red
    driver: bridge

# Volumenes nombrados: los datos sobreviven a "docker compose down" (no a "down -v").
volumes:
  postgres_data:
  rabbitmq_data:
